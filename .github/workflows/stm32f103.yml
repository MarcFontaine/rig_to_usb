name: STM32F103 Firmware Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain & Target
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: thumbv7m-none-eabi
          components: llvm-tools, rustfmt, clippy

      - name: Install cargo-binutils
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binutils

      - name: Check Formating
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy -p rig_to_usb --bin hid_raw --features=stm32f103 --target=thumbv7m-none-eabi --profile release -- -D warnings

      - name: Check Flash size
        run: cargo size -p rig_to_usb --bin hid_raw --features=stm32f103 --target=thumbv7m-none-eabi --profile release

      - name: Build firmware .bin and .hex
        run: |
          cargo-objcopy -p rig_to_usb --bin hid_raw --features=stm32f103 --target=thumbv7m-none-eabi --profile release -- -O binary stm32f103.bin
          cargo-objcopy -p rig_to_usb --bin hid_raw --features=stm32f103 --target=thumbv7m-none-eabi --profile release -- -O ihex stm32f103.hex

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: stm32f103-firmware
          path: |
            stm32f103.bin
            stm32f103.hex
          if-no-files-found: error

      - name: Publish Latest Firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest_stm32f103_firmware
          name: Latest Firmware Build
          body: "Latest STM32F103 firmware (${{ github.sha }})."
          files: |
            stm32f103.bin
            stm32f103.hex
          fail_on_unmatched_files: true
          prerelease: true
