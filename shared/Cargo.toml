[package]
name = "rig_to_usb_logic"
version = "0.1.0"
edition = "2024"

[features]
default = []
defmt = ["dep:defmt"]
std-json = ["dep:serde", "dep:serde_json", "minicbor/alloc", "dep:nix",
  "dep:gstreamer", "dep:gstreamer-webrtc" ]

[dependencies]
minicbor = { version = "2.2", features = ["derive"] }
defmt = { version = "0.3", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true}
serde_json = { version = "1.0", optional = true }
ringbuffer = { version = "0.16.0", default-features = false }
nix = { version = "0.31.1", features = [ "fs", "term"], default-features = false, optional = true }
gstreamer = { version = "0.25.3", features = ["v1_28"], optional = true }
gstreamer-webrtc = { version = "0.25.2", features = ["v1_28"], optional = true }

[[bin]]
name = "stdin_to_cbor"
path = "src/stdin_to_cbor.rs"
required-features = ["std-json"]

[[bin]]
name = "pty_bridge"
path = "src/pty_bridge.rs"
required-features = ["std-json"]

[[bin]]
name = "remote_adapter"
path = "src/remote_adapter.rs"
required-features = ["std-json"]