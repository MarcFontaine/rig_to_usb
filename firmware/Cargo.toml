[package]
name = "rig_to_usb"
version = "0.1.0"
edition = "2024"
# build = "build.rs"

[dependencies]
rig_to_usb_logic = { path = "../shared", features = ["defmt"] }

static_cell = "2.1"
nb = "1"
stm32g4 = { version = "0.16.0", features = ["atomics"], optional = true }
paste = "1.0"
fugit = "0.4.0"
fixed = { version = "1.31.0", optional = true }
embedded-io = "0.7"
stm32-hrtim = { version = "0.2.0", optional = true }
rand_core = { version = "0.10", default-features = false }
cortex-m-rt = "0.7.5"

stm32-usbd = { version = "0.8.0" }
usb-device = { version = "0.3.2", features = ["defmt", "control-buffer-256"] }

#usbd-serial = "0.3.0"
usbd-hid = "0.10.0"

cfg-if = "1.0"
panic-halt = "1.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
log = { version = "0.4.33" }
defmt-rtt = {version = "1.3.0", optional = true}
minicbor = { version = "2.2", features = ["derive"] }
git-version = { version = "0.3.9" }
ringbuffer = { version = "0.16.0", default-features = false }

[dependencies.stm32f1xx-hal]
version = "0.11.0"
features = ["stm32f103", "medium" ]

optional = true

[features]
log-itm = []
log-semihost = []
std = []
default = [ "firmware" ]
firmware = ["defmt", "defmt-rtt" ]

stm32g474 = ["dep:stm32g4xx-hal", "dep:stm32g4"]
stm32f103 = ["dep:stm32f1xx-hal"]

[dependencies.cortex-m]
version = "0.7.7"
features = ["critical-section-single-core"]

[dependencies.stm32g4xx-hal]
version = "0.1.0"
features = [
  "stm32g474",
  "log-rtt",
  "defmt",
  "usb",
  "rt"]
optional = true

[dependencies.fdcan]
version = "0.2.1"
features = ["fdcan_g0_g4_l5"]
optional = true

[dependencies.cast]
version = "0.3.0"
default-features = false

[dependencies.embedded-hal-old]
package = "embedded-hal"
features = ["unproven"]
version = "0.2.7"

[dependencies.embedded-hal]
version = "1.0.0"

[dependencies.embedded-dma]
version = "0.2.0"

[dependencies.void]
default-features = false
version = "1.0.2"

[dependencies.defmt]
version = "1"
optional = true
[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "hid_raw"
path = "src/hid_raw.rs"
