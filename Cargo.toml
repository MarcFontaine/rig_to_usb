[package]
name = "rig_to_usb"
version = "0.1.0"
edition = "2024"

[dependencies]
nb = "1"
stm32g4 = { version = "0.16.0", features = ["atomics"] }
paste = "1.0"
fugit = "0.4.0"
stm32-usbd = { version = "0.8.0" }
fixed = { version = "1.31.0", optional = true }
embedded-io = "0.7"
stm32-hrtim = { version = "0.2.0", optional = true }
rand_core = { version = "0.10", default-features = false }
usb-device = { version = "0.3.2", features = ["defmt", "control-buffer-256"] }
cortex-m-rt = "0.7.5"
usbd-serial = "0.2.2"
usbd-audio = "0.4"
usbd-hid = "0.10.0"
cfg-if = "1.0"
panic-halt = "1.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
log = { version = "0.4.33" }
defmt-rtt = "1.3.0"
minicbor = { version = "2.2", features = ["derive"] }

[features]
log-itm = []
log-semihost = []
default = ["defmt"]
std = []

[dependencies.cortex-m]
version = "0.7.7"
features = ["critical-section-single-core"]

[dependencies.stm32g4xx-hal]
version = "0.1.0"
features = [
  "stm32g474",
  "log-rtt",
  "defmt",
  "usb",
  "rt"]

[dependencies.fdcan]
version = "0.2.1"
features = ["fdcan_g0_g4_l5"]
optional = true

[dependencies.cast]
version = "0.3.0"
default-features = false

[dependencies.embedded-hal-old]
package = "embedded-hal"
features = ["unproven"]
version = "0.2.7"

[dependencies.embedded-hal]
version = "1.0.0"

[dependencies.embedded-dma]
version = "0.2.0"

[dependencies.void]
default-features = false
version = "1.0.2"

[dependencies.defmt]
version = "1"
optional = true

[dev-dependencies]
cortex-m-rt = "0.7.5"
defmt-rtt = "1.3.0"
embedded-test = "0.7.1"
cortex-m-rtic = "1.1.4"
cortex-m-semihosting = "0.5.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
panic-semihosting = "0.6.0"
panic-halt = "1.0.0"
panic-itm = "0.4.2"
lazy_static = { version = "1.5", features = ["spin_no_std"] }
log = "0.4.33"
cortex-m-log = { version = "0.8", features = ["log-integration"] }
cfg-if = "1.0.4"
mpu6050 = "0.1.6"
bme680 = "0.6.0"
embedded-sdmmc = "0.9.0"
usb-device = { version = "0.3.2", features = ["defmt", "control-buffer-256"] }
usbd-serial = "0.2.2"
usbd-audio = "0.4"
rand = { version = "0.10", default-features = false }

[profile.dev]
codegen-units = 1
debug = true
incremental = false
lto = false

[profile.release]
debug = false
codegen-units = 1
incremental = false
lto = true

[profile.test]
opt-level = "s"
debug = true
codegen-units = 1
incremental = false
lto = true

[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "hid_raw"
path = "src/hid_raw.rs"
